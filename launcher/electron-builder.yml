appId: ru.theageafter.launcher
productName: The Age After
copyright: Makarexe
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: TheAgeAfter-Setup-${version}.${ext}
nsis:
  # One click, per user: no admin rights needed, and updates install silently.
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: The Age After
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: Makarexe
  repo: the-age-after
  releaseType: release
