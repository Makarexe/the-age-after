appId: ru.theageafter.launcher
productName: The Age After
copyright: Makarexe
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: resources/vanilla-blockstates-fix.zip
    to: vanilla-blockstates-fix.zip
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
  artifactName: TheAgeAfter-Setup-${version}.${ext}
mac:
  # Unsigned and not notarized (no Apple Developer account): the player opens it once via right click → Open.
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.games
  identity: null
  artifactName: TheAgeAfter-${version}-mac-${arch}.${ext}
nsis:
  # One click, per user: no admin rights needed, and updates install silently.
  oneClick: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: The Age After
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: Makarexe
  repo: the-age-after
  releaseType: release
