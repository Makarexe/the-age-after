name: server-mod

# Builds ageafterauth.jar. Every run uploads it as an artifact. A tag `ageafterauth-v<version>`, or
# Run workflow on main with "publish" ticked, also publishes it as a GitHub Release
# ageafterauth-v<mod_version from gradle.properties>.
on:
  push:
    # With only `tags` listed, branch pushes would not trigger the workflow at all.
    branches: ['**']
    tags: ['ageafterauth-v*']
    paths: ['server-mod/**', '.github/workflows/server-mod.yml']
  pull_request:
    paths: ['server-mod/**', '.github/workflows/server-mod.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Опубликовать релиз ageafterauth-v<mod_version> (только из main)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ageafterauth
          path: server-mod/build/libs/ageafterauth-*.jar
          if-no-files-found: error
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/ageafterauth-v') || (inputs.publish && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          tag="ageafterauth-v$version"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "tag $GITHUB_REF_NAME != $tag (mod_version in gradle.properties)"; exit 1
          fi
          jar="build/libs/ageafterauth-$version.jar"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$jar" --clobber
          else
            # Never "latest": electron-updater takes launcher updates from the latest release.
            gh release create "$tag" "$jar" --target "$GITHUB_SHA" --prerelease \
              --title "ageafterauth $version" \
              --notes "Мод The Age After: на сервере — вход через наши аккаунты, у игроков — аватары Figura. Положите jar в mods/ сервера и инстанса CurseForge."
          fi
