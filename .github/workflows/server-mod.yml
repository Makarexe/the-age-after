name: server-mod

# Builds ageafterauth.jar. Every run uploads it as an artifact; a tag `ageafterauth-v<version>`
# also publishes it as a GitHub Release.
on:
  push:
    # With only `tags` listed, branch pushes would not trigger the workflow at all.
    branches: ['**']
    tags: ['ageafterauth-v*']
    paths: ['server-mod/**', '.github/workflows/server-mod.yml']
  pull_request:
    paths: ['server-mod/**', '.github/workflows/server-mod.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ageafterauth
          path: server-mod/build/libs/ageafterauth-*.jar
          if-no-files-found: error
      - if: startsWith(github.ref, 'refs/tags/ageafterauth-v')
        uses: softprops/action-gh-release@v2
        with:
          files: server-mod/build/libs/ageafterauth-*.jar
          # Never "latest": electron-updater takes launcher updates from the latest release.
          prerelease: true
