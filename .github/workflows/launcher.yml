name: launcher

# Every push: typecheck, tests, build. The Windows installer is built and published to GitHub
# Releases (where electron-updater finds it) on a tag `v<version>` matching launcher/package.json,
# or from the Actions tab: Run workflow on main with "publish" ticked.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['launcher/**', 'tools/pack/**', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['launcher/**', 'tools/pack/**', '.github/workflows/launcher.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Опубликовать релиз (только из main; без галочки — просто собрать установщик)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  installer:
    # Tag or "publish" on main → build and publish a release; any other manual run → only build the
    # installer and attach it to the run (to test it before releasing).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (inputs.publish && github.ref == 'refs/heads/main') }}
      # Optional repository variable overriding the account server URL (Settings → Variables → Actions).
      MAIN_VITE_API_ROOT: ${{ vars.LAUNCHER_API_ROOT }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: npm ci
      - name: Build installer
        if: env.PUBLISH != 'true'
        run: npm run dist
      - if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: launcher/release/*.exe
          if-no-files-found: error
      - name: Build and publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
