name: launcher

# Every push: typecheck, tests, build. The Windows installer is built and published to GitHub
# Releases (where electron-updater finds it) on a tag `v<version>` matching launcher/package.json,
# or from the Actions tab: Run workflow on main with "publish" ticked.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['launcher/**', 'tools/pack/**', '.github/workflows/launcher.yml']
  pull_request:
    paths: ['launcher/**', 'tools/pack/**', '.github/workflows/launcher.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: Опубликовать релиз (только из main; без галочки — просто собрать установщик)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  installer:
    # Tag or "publish" on main → build and publish a release; any other manual run → only build the
    # installer and attach it to the run (to test it before releasing).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (inputs.publish && github.ref == 'refs/heads/main') }}
      # Optional repository variable overriding the account server URL (Settings → Variables → Actions).
      MAIN_VITE_API_ROOT: ${{ vars.LAUNCHER_API_ROOT }}
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - run: npm ci
      - name: Build installer
        if: env.PUBLISH != 'true'
        run: npm run dist
      - if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: launcher/release/*.exe
          if-no-files-found: error
      # electron-builder uploads the exe and the blockmap in parallel and both try to create the
      # release: one wins, the other fails. Creating it first (with the tag) avoids the race.
      - name: Create the GitHub release
        if: env.PUBLISH == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" \
            --title "The Age After $tag" --notes "Лаунчер The Age After $tag. Windows: TheAgeAfter-Setup-*.exe. macOS: TheAgeAfter-*-mac-arm64.dmg (Apple Silicon) или -mac-x64.dmg (Intel). Linux x64: TheAgeAfter-*-linux-x64.AppImage или .deb."
      - name: Build and publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

  # Every push: the app is packed (not installed) on Linux and macOS, so a broken electron-builder config shows up early.
  package-check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    needs: check
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - run: npm run pack:dir

  # Unsigned macOS (.dmg for Apple Silicon and Intel) and Linux (AppImage + deb, x64) builds. They run after the
  # Windows job, which creates the release.
  installer-unix:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            files: |
              launcher/release/*.dmg
          - os: ubuntu-latest
            name: linux
            files: |
              launcher/release/*.AppImage
              launcher/release/*.deb
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') || (inputs.publish && github.ref == 'refs/heads/main') }}
      MAIN_VITE_API_ROOT: ${{ vars.LAUNCHER_API_ROOT }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - run: npm ci
      - name: Build installers
        if: env.PUBLISH != 'true'
        run: npm run dist:${{ matrix.name }}
      - if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: Build and publish
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:${{ matrix.name }}
